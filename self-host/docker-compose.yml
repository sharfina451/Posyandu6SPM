version: '3.8'

services:
  # 1. Database: PostgreSQL + PostGIS (for GIS spatial indexing)
  db:
    image: postgis/postgis:15-3.3
    container_name: posyandu-db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin1234}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../supabase/migrations:/docker-entrypoint-initdb.d/migrations
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Local Object Storage (S3-compatible via MinIO)
  storage:
    image: minio/minio:RELEASE.2023-10-25T06-33-36Z
    container_name: posyandu-storage
    restart: always
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Admin Dashboard Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin1234}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. PostgREST API: Auto REST API mapper for PostgreSQL
  api:
    image: postgrest/postgrest:v12.2.0
    container_name: posyandu-api
    restart: always
    ports:
      - '3000:3000'
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-admin1234}@db:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: postgres
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-posyandu-6spm-key}
    depends_on:
      db:
        condition: service_healthy

  # 4. Kong API Gateway: Unifies routing to database REST, Auth, and Storage services
  gateway:
    image: kong:3.4
    container_name: posyandu-gateway
    restart: always
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl http2
    ports:
      - '8000:8000' # Unified Gateway Port for REST & Storage APIs
    volumes:
      - ./kong.yml:/usr/local/kong/kong.yml:ro
    depends_on:
      - db
      - api
      - storage

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local
